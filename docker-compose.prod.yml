services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: http://157.173.96.140:8976
    restart: unless-stopped
    ports:
      - "8976:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      # Runtime serverURL — runner stage nie dziedziczy ENV z build stage,
      # a build arg nie trafia do runtime. Bez tego serverURL='' w runtime.
      NEXT_PUBLIC_SERVER_URL: http://157.173.96.140:8976
    volumes:
      - media_data:/app/public/media
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data:
  media_data:
